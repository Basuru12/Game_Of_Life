<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life RPG — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Life RPG Login</h1>
    <p id="status" class="page-intro">Checking session…</p>

    <form id="auth-form" class="add-quest-form">
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" required autocomplete="email" />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="password" required minlength="6" autocomplete="current-password" />
      </label>
      <div class="quest-form-actions">
        <button type="submit" id="signin-btn" class="create-btn">Sign in</button>
        <button type="button" id="signup-btn" class="quest-cancel-btn">Sign up</button>
        <button type="button" id="signout-btn" class="quest-cancel-btn hidden">Sign out</button>
      </div>
      <p id="auth-error" class="error hidden"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
  <script src="game.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("auth-error");
    const signOutBtn = document.getElementById("signout-btn");

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove("hidden");
    }

    function clearError() {
      errorEl.classList.add("hidden");
      errorEl.textContent = "";
    }

    async function refreshStatus() {
      clearError();
      try {
        const session = await getSession();
        if (session && session.user) {
          statusEl.textContent = "Signed in as " + session.user.email;
          signOutBtn.classList.remove("hidden");
        } else {
          statusEl.textContent = "Not signed in.";
          signOutBtn.classList.add("hidden");
        }
      } catch (error) {
        statusEl.textContent = "Could not read session.";
        showError(error.message);
      }
    }

    document.getElementById("auth-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await signIn(email, password);
        await redirectToAppHome();
      } catch (error) {
        showError(error.message);
      }
    });

    document.getElementById("signup-btn").addEventListener("click", async () => {
      clearError();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await signUp(email, password);
        statusEl.textContent =
          "Sign up sent. If email confirm is on, check your inbox; then sign in.";
        await refreshStatus();
      } catch (error) {
        showError(error.message);
      }
    });

    signOutBtn.addEventListener("click", async () => {
      clearError();
      try {
        await signOut();
        await refreshStatus();
      } catch (error) {
        showError(error.message);
      }
    });

    getSession()
      .then(function (session) {
        if (session && session.user) {
          return redirectToAppHome();
        }
        return refreshStatus();
      })
      .catch(function (error) {
        statusEl.textContent = "Could not read session.";
        showError(error.message);
      });
  </script>
</body>
</html>
