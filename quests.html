<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life RPG — Quests</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header id="player-header" class="player-header"></header>

    <header class="quests-page-header">
      <h1>Quests</h1>
    </header>

    <p class="page-intro">Complete real-life actions to earn XP and level up.</p>

    <form id="add-quest-form" class="add-quest-form">
      <h2 id="quest-form-title">Add a quest</h2>
      <input type="hidden" id="editing-quest-id" value="" />

      <label class="field">
        <span>Category</span>
        <select id="quest-category"></select>
      </label>

      <label class="field">
        <span>Title</span>
        <input type="text" id="quest-title" placeholder="What will you do?" maxlength="80" />
      </label>

      <label class="field">
        <span>Description</span>
        <input type="text" id="quest-description" placeholder="Optional details" maxlength="140" />
      </label>

      <label class="field">
        <span>XP</span>
        <input type="number" id="quest-xp" value="30" min="1" max="200" />
      </label>

      <div class="quest-form-actions">
        <button type="submit" id="quest-submit-btn" class="create-btn">Add quest</button>
        <button type="button" id="quest-cancel-btn" class="quest-cancel-btn hidden">Cancel</button>
      </div>
      <p id="add-quest-error" class="error hidden"></p>
    </form>

    <section id="quest-list" class="quest-list"></section>

    <p class="back-link">
      <a href="index.html">Create a new avatar</a>
    </p>
  </main>

  <script src="game.js"></script>
  <script src="quests.js"></script>
</body>
</html>
