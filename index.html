<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life RPG — Create Avatar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Create Your Life Avatar</h1>

    <label class="field">
      <span>Name</span>
      <input type="text" id="name-input" placeholder="Enter a name" maxlength="24" />
    </label>

    <section class="field">
      <span>Look</span>
      <div id="look-options" class="look-options"></div>
    </section>

    <p class="points">Points left: <strong id="points-left">30</strong></p>

    <section id="attributes" class="attributes"></section>

    <button type="button" id="create-btn" class="create-btn">Begin</button>
    <p id="create-error" class="error hidden"></p>
  </main>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
